<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#102b46" />
    <title>Respack | NCR Management</title>
    <style>
      .web-search-bar{position:relative;z-index:10;padding:12px 20px;background:#fff;border-bottom:1px solid #e4eaf1}
      .web-search-form{display:flex;gap:10px;max-width:1100px;margin:0 auto}
      .web-search-input{flex:1;min-width:0;padding:12px 16px;border:1px solid #cbd5e1;border-radius:8px;color:#243447;font:inherit;outline:none}
      .web-search-input:focus{border-color:#2563eb;box-shadow:0 0 0 3px #2563eb22}
      .web-search-button{padding:0 20px;border:0;border-radius:8px;background:#102b46;color:#fff;font:inherit;font-weight:600;white-space:nowrap}
      .web-search-button:hover{background:#1b456c}
      @media(max-width:480px){.web-search-bar{padding:10px 12px}.web-search-form{gap:7px}.web-search-button{padding:0 12px}}
    </style>
  </head>
  <body>
    <div class="web-search-bar">
      <form class="web-search-form" action="https://duckduckgo.com/" method="get" target="_blank" rel="noopener noreferrer" role="search" aria-label="Search the web">
        <input class="web-search-input" type="search" name="q" placeholder="Search the web with DuckDuckGo..." aria-label="Search the web" required />
        <button class="web-search-button" type="submit">Search web</button>
      </form>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
